server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/saxxi}
    username: ${DATABASE_USERNAME:saxxi}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

app:
  security:
    jwt:
      issuer: ${SUPABASE_URL}/auth/v1
      jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
